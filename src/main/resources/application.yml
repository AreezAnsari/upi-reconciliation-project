      hikari:
        maximum-pool-size: 100
        max-lifetime: 1800000
        idle-timeout: 300000
        connection-timeout: 60000
        minimumIdle: 5
        poolName: HikariCP
        leakDetectionThreshold: 600000
        validationTimeout: 5000
        connection-test-query: SELECT 1 FROM DUAL
        # Every pooled connection starts with parallel DML disabled — without this, a session
        # that reused a connection after ANY parallel-eligible DML on a table can throw
        # ORA-12838 ("cannot read/modify an object after modifying it in parallel") on a later,
        # completely unrelated query against that same table.
        connection-init-sql: ALTER SESSION DISABLE PARALLEL DML
        dataSourceProperties:
          oracle:
            jdbc:
              ReadTimeout: 900000
